name: peblo-tv-mini

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peblo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peblo}
      POSTGRES_DB: ${POSTGRES_DB:-peblo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-peblo} -d ${POSTGRES_DB:-peblo}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-peblo}:${POSTGRES_PASSWORD:-peblo}@db:5432/${POSTGRES_DB:-peblo}
      JWT_SECRET: ${JWT_SECRET:-dev-only-not-a-real-secret}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_ROOT: /data/storage
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-http://localhost:8000/media}
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      AUTO_SEED: "true"
      ENVIRONMENT: local
    volumes:
      # Artwork and published catalogue files survive a container restart, which
      # is how you can see that a rollback points at a file that really is still there.
      - storage:/data/storage
    ports:
      - "8000:8000"

  cms:
    build:
      context: .
      dockerfile: cms/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_VIEWER_URL: http://localhost:5174
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"

  viewer:
    build:
      context: .
      dockerfile: viewer/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5174:5174"

volumes:
  pgdata:
  storage:
